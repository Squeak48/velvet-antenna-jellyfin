name: Build Velvet Antenna v0.22 bundle

on:
  push:
    branches: [main]
    paths:
      - 'src/v022/**'
      - 'mods-v022.json'
      - '.github/workflows/build-v022.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v0.22.6 first-paint and collection assets
        run: |
          cat \
            src/v022/00-v226-bootstrap.js \
            velvet-antenna-v0215.js \
            src/v022/02-subtitle-search.js \
            src/v022/05-v224-shell.js \
            src/v022/06-v224-home.js \
            src/v022/07-v224-lens.js \
            src/v022/09-v226-collection-manager.js \
            > velvet-antenna-v0226.js

          cat \
            velvet-antenna-v0215.css \
            src/v022/01-flow.css \
            src/v022/03-v224.css \
            src/v022/04-v225-collection-manager.css \
            src/v022/05-v226-fixes.css \
            > velvet-antenna-v0226.css

      - name: Validate v0.22.6 assets
        run: |
          node --check velvet-antenna-v0226.js
          python - <<'PY'
          from pathlib import Path

          js = Path('velvet-antenna-v0226.js').read_text(encoding='utf-8')
          css = Path('velvet-antenna-v0226.css').read_text(encoding='utf-8')
          modules = [Path(p).read_text(encoding='utf-8') for p in (
              'src/v022/00-v226-bootstrap.js',
              'src/v022/02-subtitle-search.js',
              'src/v022/05-v224-shell.js',
              'src/v022/06-v224-home.js',
              'src/v022/07-v224-lens.js',
              'src/v022/09-v226-collection-manager.js'
          )]

          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace count mismatch')
          if any('MutationObserver' in text for text in modules):
              raise SystemExit('v0.22.6 modules must remain bounded and observer-free')

          required = (
              'v0.22.6 first-paint bootstrap loaded',
              'va226-boot-screen',
              "const CORE = ['movies', 'series', 'collections']",
              'velvet-antenna-v0224:route:',
              "else value = '#/list?parentId=' + id",
              'TUNING A FAST SIGNAL',
              'va224-library-stage',
              'RemoteSearch/Subtitles/',
              'DOWNLOAD & USE',
              'v0.22.6 deterministic Collection Manager loaded',
              'va226-manage-collection',
              'MANAGE COLLECTION',
              'ADD FROM LIBRARY',
              'LIKELY MISSING',
              "client.getUrl('Collections/' + encodeURIComponent(collectionId) + '/Items'",
              "IncludeItemTypes: 'Movie,Series,BoxSet'",
              "IncludeItemTypes: 'Movie,Series'"
          )
          for marker in required:
              if marker not in js:
                  raise SystemExit(f'Missing v0.22.6 feature marker: {marker}')

          forbidden = (
              'v0.22.3 immediate API-backed navigation loaded',
              'v0.22.3 deterministic library stage loaded',
              'v0.22.5 Collection Manager loaded'
          )
          for marker in forbidden:
              if marker in js:
                  raise SystemExit(f'Legacy controller leaked into v0.22.6: {marker}')

          shell = Path('src/v022/05-v224-shell.js').read_text(encoding='utf-8')
          if "navButton('LIVE'" in shell or "live: 'LIVE'" in shell:
              raise SystemExit('Unproven Live navigation must not be exposed in v0.22.6')

          required_css = (
              '#va224-nav',
              '#va224-home',
              '#va224-library-stage',
              '#va226-boot-screen',
              '#va226-manage-collection',
              '#va226-collection-manager',
              '.va225-collection-row',
              '#va22-subtitle-search',
              '#va22-subtitle-overlay',
              '.selectionCommandsPanel'
          )
          for marker in required_css:
              if marker not in css:
                  raise SystemExit(f'Missing v0.22.6 CSS marker: {marker}')
          PY

      - name: Advertise v0.22 alongside rollback builds
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          entry = json.loads(Path('mods-v022.json').read_text(encoding='utf-8'))[0]
          for manifest_name in ('mods-v020.json', 'mods-v017.json', 'mods.json'):
              path = Path(manifest_name)
              data = json.loads(path.read_text(encoding='utf-8'))
              data = [mod for mod in data if mod.get('id') != entry['id']]
              data.append(entry)
              path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit generated v0.22.6 bundle
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            velvet-antenna-v0226.js \
            velvet-antenna-v0226.css \
            mods-v020.json \
            mods-v017.json \
            mods.json
          git commit -m 'Build Velvet Antenna v0.22.6 first-paint collection fix'
          git push
