name: Build Velvet Antenna v0.22 bundle

on:
  push:
    branches: [main]
    paths:
      - 'src/v022/**'
      - 'mods-v022.json'
      - '.github/workflows/build-v022.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v0.22.8 reliability assets
        run: |
          cat \
            src/v022/00-v226-bootstrap.js \
            velvet-antenna-v0215.js \
            src/v022/02-subtitle-search.js \
            src/v022/05-v224-shell.js \
            src/v022/06-v224-home.js \
            src/v022/07-v224-lens.js \
            src/v022/10-v227-collection-manager.js \
            src/v022/11-v228-reliability.js \
            > velvet-antenna-v0228.js

          cat \
            velvet-antenna-v0215.css \
            src/v022/01-flow.css \
            src/v022/03-v224.css \
            src/v022/04-v225-collection-manager.css \
            src/v022/05-v226-fixes.css \
            src/v022/06-v227-source-check.css \
            src/v022/07-v228-reliability.css \
            > velvet-antenna-v0228.css

      - name: Validate v0.22.8 assets
        run: |
          node --check velvet-antenna-v0228.js
          python - <<'PY'
          from pathlib import Path

          js = Path('velvet-antenna-v0228.js').read_text(encoding='utf-8')
          css = Path('velvet-antenna-v0228.css').read_text(encoding='utf-8')
          modules = [Path(p).read_text(encoding='utf-8') for p in (
              'src/v022/00-v226-bootstrap.js',
              'src/v022/02-subtitle-search.js',
              'src/v022/05-v224-shell.js',
              'src/v022/06-v224-home.js',
              'src/v022/07-v224-lens.js',
              'src/v022/10-v227-collection-manager.js',
              'src/v022/11-v228-reliability.js'
          )]

          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace count mismatch')
          if any('MutationObserver' in text for text in modules):
              raise SystemExit('v0.22.8 modules must remain observer-free')

          required = (
              'v0.22.6 first-paint bootstrap loaded',
              "const CORE = ['movies', 'series', 'collections']",
              'TUNING A FAST SIGNAL',
              'va224-library-stage',
              'RemoteSearch/Subtitles/',
              'DOWNLOAD & USE',
              'v0.22.7 source-aware Collection Manager loaded',
              'SOURCE CHECK',
              'VelvetAntennaBridge/TmdbCollection/',
              'OWNED • NOT IN COLLECTION',
              'MISSING FROM LIBRARY',
              'v0.22.8 deterministic interaction layer loaded',
              'va228-player-exit',
              'CHANGE POSTER',
              'CHANGE BACKDROP',
              'uploadItemImage',
              'headerBackButton',
              'getUserViews',
              'data-va228Owned'
          )
          for marker in required:
              if marker not in js:
                  raise SystemExit(f'Missing v0.22.8 feature marker: {marker}')

          forbidden = (
              'LIKELY MISSING',
              'MutationObserver'
          )
          for marker in forbidden:
              if marker in js:
                  raise SystemExit(f'Forbidden behavior leaked into v0.22.8: {marker}')

          required_css = (
              '#va224-nav',
              '#va224-home',
              '#va224-library-stage',
              '#va226-manage-collection',
              '#va226-collection-manager',
              '.va227-source-row',
              '#va228-player-exit',
              '#va228-collection-artwork',
              '#va22-subtitle-search',
              '.selectionCommandsPanel'
          )
          for marker in required_css:
              if marker not in css:
                  raise SystemExit(f'Missing v0.22.8 CSS marker: {marker}')
          PY

      - name: Advertise v0.22 alongside rollback builds
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          entry = json.loads(Path('mods-v022.json').read_text(encoding='utf-8'))[0]
          for manifest_name in ('mods-v020.json', 'mods-v017.json', 'mods.json'):
              path = Path(manifest_name)
              data = json.loads(path.read_text(encoding='utf-8'))
              data = [mod for mod in data if mod.get('id') != entry['id']]
              data.append(entry)
              path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit generated v0.22.8 bundle
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            velvet-antenna-v0228.js \
            velvet-antenna-v0228.css \
            mods-v020.json \
            mods-v017.json \
            mods.json
          git commit -m 'Build Velvet Antenna v0.22.8 reliability release'
          git push
