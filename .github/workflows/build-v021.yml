name: Build Velvet Antenna v0.21 bundle

on:
  push:
    branches: [main]
    paths:
      - 'src/v021/**'
      - 'mods-v021.json'
      - '.github/workflows/build-v021.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build monolithic JellyFrame assets
        run: |
          cat \
            src/v021/01-shell.js \
            src/v021/02-lens.js \
            src/v021/03-runtime.js \
            src/v021/04-workbench.js \
            src/v021/05-detail-play.js \
            > velvet-antenna-v0215.js

          cat \
            src/v021/01-base.css \
            src/v021/02-surface.css \
            src/v021/03-workbench-actions.css \
            src/v021/03-detail-play.css \
            src/v021/04-hide-native-library-chrome.css \
            src/v021/05-native-selection.css \
            > velvet-antenna-v0215.css

          python - <<'PY'
          from pathlib import Path
          path = Path('velvet-antenna-v0215.js')
          content = path.read_text(encoding='utf-8')
          content = content.replace("const VERSION = '0.21.0';", "const VERSION = '0.21.5';", 1)
          path.write_text(content, encoding='utf-8')
          PY

      - name: Validate generated assets
        run: |
          node --check velvet-antenna-v0215.js
          python - <<'PY'
          from pathlib import Path
          js = Path('velvet-antenna-v0215.js').read_text(encoding='utf-8')
          css = Path('velvet-antenna-v0215.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace count mismatch')
          if 'MutationObserver' in js:
              raise SystemExit('v0.21 must not reintroduce MutationObserver')
          for required in (
              "Items/RemoteSearch/",
              "Items/RemoteSearch/Apply/",
              "deleteItem(String(item.Id))",
              "va21-wb-resolution",
              "data-va21-wb-action=\"identify\"",
              "va21-detail-playbar",
              "PLAY UNAVAILABLE",
              "genuineLocalPlayButton"
          ):
              if required not in js:
                  raise SystemExit(f'Missing v0.21.5 feature: {required}')
          for required_css in (
              "body.va21-page-library .skinHeader {\n  display: none !important;",
              "#va21-library-stage {\n  margin-top: 0 !important;",
              "body.va21-viewer .selectionCommandsPanel {",
              "z-index: 300000 !important;"
          ):
              if required_css not in css:
                  raise SystemExit(f'Missing v0.21.5 native selection compatibility: {required_css}')
          PY

      - name: Advertise v0.21 alongside rollback builds
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          entry = json.loads(Path('mods-v021.json').read_text(encoding='utf-8'))[0]
          for manifest_name in ('mods-v020.json', 'mods-v017.json', 'mods.json'):
              path = Path(manifest_name)
              data = json.loads(path.read_text(encoding='utf-8'))
              data = [mod for mod in data if not str(mod.get('id', '')).startswith('velvet-antenna-v021')]
              data.append(entry)
              path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit generated bundle
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            velvet-antenna-v0215.js \
            velvet-antenna-v0215.css \
            mods-v020.json \
            mods-v017.json \
            mods.json
          git commit -m 'Build Velvet Antenna v0.21.5 native selection fix'
          git push
